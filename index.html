    <meta charset="UTF-8" />

      name="description"
      content="تقويم الالتزام لمساعدتك على متابعة عاداتك اليومية وتحقيق أهدافك."
    />
    <meta name="keywords" content="تقويم, عادات, أهداف, تنظيم, إنتاجية" />
    <meta name="author" content="مطور البرمجيات" />

    <meta property="og:title" content="تقويم الالتزام - تابع عاداتك اليومية" />
    <meta
      property="og:description"
      content="ساعد نفسك على تحقيق أهدافك اليومية ومتابعة عاداتك مع تقويم الالتزام."
    />

      property="og:image"
      content="https://consistancycalender.netlify.app/photo_2024-12-06_13-56-27.jpg"
    />
    <meta property="og:url" content="https://consistancycalender.netlify.app" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_AR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="تقويم الالتزام - راقب عاداتك وحقق أهدافك"
    />
    <meta
      name="twitter:description"
      content="التزم بعاداتك اليومية بسهولة مع تقويم الالتزام. تابع تقدمك اليوم!"
    />
    <meta
      name="twitter:image"
      content="https://consistancycalender.netlify.app/photo_2024-12-06_13-56-27.jpg"
    />
    <meta name="twitter:site" content="@Tasneem42532994" />

    <link
      rel="icon"
      href="photo_2024-12-06_13-56-27.jpg"
      sizes="32x32"
      type="image/png"
    />
    <link rel="manifest" href="/manifest.json" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />

    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-36NJ6BS61F"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-36NJ6BS61F");
    </script>
  </head>
  <body>
    <main class="app-container">
      <section class="monthly-vision-board" id="visionBoard">
        <div class="image" data-month="January">
          <i class="fas fa-plus"></i>
        </div>
        <div class="image" data-month="February">
          <i class="fas fa-plus"></i>
        </div>
        <div class="image" data-month="March"><i class="fas fa-plus"></i></div>
        <div class="image" data-month="April"><i class="fas fa-plus"></i></div>
        <div class="image" data-month="May"><i class="fas fa-plus"></i></div>
        <div class="image" data-month="June"><i class="fas fa-plus"></i></div>
        <div class="image" data-month="July"><i class="fas fa-plus"></i></div>
        <div class="image" data-month="August"><i class="fas fa-plus"></i></div>
        <div class="image" data-month="September">
          <i class="fas fa-plus"></i>
        </div>
        <div class="image" data-month="October">
          <i class="fas fa-plus"></i>
        </div>
        <div class="image" data-month="November">
          <i class="fas fa-plus"></i>
        </div>
        <div class="image" data-month="December">
          <i class="fas fa-plus"></i>
        </div>
      </section>

      <section class="main-content">
        <div class="habit-tracker">
          <h1 id="editableText">سألتزم بهذه العادة هذا العام</h1>
          <div id="editControls" style="display: none">
            <button id="saveBtn" class="btn">حفظ</button>
            <button id="cancelBtn" class="btn btn-secondary">إلغاء</button>
          </div>
        </div>

        <div class="calendar-container">
          <div class="calendar-header">
            <button id="prevBtn" class="nav-btn">
              <i class="fas fa-chevron-right"></i>
            </button>
            <h2 id="monthYear"></h2>
            <button id="nextBtn" class="nav-btn">
              <i class="fas fa-chevron-left"></i>
            </button>
          </div>
          <div id="calendarBody" class="calendar-body"></div>
        </div>

        <div class="progress-container">
          <p>استمر في التقدم، أنت تقوم بعمل رائع!</p>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill">
              <span></span>
            </div>
          </div>
        </div>
      </section>

      <aside class="controls">
        <button
          class="control-btn"
          id="calendarIcon"
          title="إظهار/إخفاء التقويم"
        >
          <i class="fas fa-calendar-alt"></i>
        </button>
        <button class="control-btn" id="noteIcon" title="ملاحظاتي">
          <i class="fa-solid fa-bag-shopping"></i>
        </button>
        <button class="control-btn" id="notificationIcon" title="الإشعارات">
          <i class="fas fa-bell"></i>
        </button>
        <a href="use.html" class="control-btn" title="عن التطبيق"
          ><i class="fa-solid fa-address-card"></i
        ></a>
        <div class="color-picker-wrapper">
          <button class="control-btn" id="colorPaletteIcon" title="تغيير اللون">
            <i class="fas fa-palette"></i>
          </button>
          <input type="color" id="colorPicker" />
        </div>
      </aside>
    </main>

    <div id="noteModal" class="modal hidden">
      <div class="modal-content">
        <span class="close-btn" id="closeNoteModal">&times;</span>
        <h3>لماذا هذه العادة مهمة؟</h3>
        <textarea
          id="noteText"
          placeholder="اكتب هنا الأسباب التي تدفعك للالتزام..."
        ></textarea>
        <div class="modal-actions">
          <button id="saveNote" class="btn">حفظ الملاحظة</button>
          <button id="deleteNote" class="btn btn-danger">حذف</button>
        </div>
      </div>
    </div>

    <div id="notificationModal" class="modal hidden">
      <div class="modal-content">
        <span class="close-btn" id="closeNotification">&times;</span>
        <h3>ملخص التقدم</h3>
        <p id="notificationMessage"></p>
      </div>
    </div>

    <div id="imageModal" class="modal hidden">
      <div class="modal-content">
        <span class="close-btn" id="closeImageModal">&times;</span>
        <h3>خيارات الصورة</h3>
        <div class="modal-actions">
          <button id="changeImage" class="btn">تغيير الصورة</button>
          <button id="deleteImage" class="btn btn-danger">حذف الصورة</button>
        </div>
      </div>
    </div>

    <div id="guide" class="hidden">
      <p id="message"></p>
      <div class="guide-actions">
        <button id="next" class="btn">التالي</button>
        <button id="stop" class="btn btn-secondary">إنهاء الجولة</button>
      </div>
    </div>
    <div class="overlay hidden"></div>

    <script src="main.js"></script>
  </body>
</html>
